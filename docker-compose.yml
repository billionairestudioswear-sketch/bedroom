services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - wp_data:/var/www/html

  wpcli:
    image: wordpress:cli
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        until [ -f /var/www/html/wp-load.php ]; do
          echo "waiting for WordPress core files..."
          sleep 2
        done
        until wp core is-installed --path=/var/www/html --allow-root; do
          echo "installing WordPress..."
          wp core install \
            --path=/var/www/html \
            --url="http://localhost:${WORDPRESS_PORT:-8080}" \
            --title="${WORDPRESS_TITLE:-Local WordPress}" \
            --admin_user="${WORDPRESS_ADMIN_USER:-admin}" \
            --admin_password="${WORDPRESS_ADMIN_PASSWORD:-admin}" \
            --admin_email="${WORDPRESS_ADMIN_EMAIL:-admin@example.com}" \
            --skip-email \
            --allow-root || sleep 2
        done
        echo "WordPress admin ready: admin_user=${WORDPRESS_ADMIN_USER:-admin}"
    restart: "no"

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db

volumes:
  db_data:
  wp_data:
